<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
        <title>Tab Functionality</title>
    </head>
    <body>
        <div class="tab-container">
            <div class="tab-menu">
                <button class="tab-btn active" data-tab="tab1">Tab1</button>
                <button class="tab-btn" data-tab="tab2">Tab2</button>
                <button class="tab-btn" data-tab="tab3">Tab3</button>
                <button class="tab-btn" data-tab="tab4">Tab4</button>
            </div>
            
            <div class="tab-content-wrapper">
                <div id="tab1" class="tab-content active">
                    <p>Hello World</p>
                </div>
                <div id="tab2" class="tab-content">
                    <p>With great power comes great responsibility.</p>
                </div>
                <div id="tab3" class="tab-content">
                    <img src="Images/Spider.jpeg"/>
                </div>
                <div id="tab4" class="tab-content">
                    <p>Bye World</p>
                </div>
            </div>
        </div>
    </body>
</html>
